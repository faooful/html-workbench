<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src blob: 'self'" />
  <title>Plan Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <div id="chrome-bar">
    <div id="chrome-window-spacer"></div>
    <button id="chrome-search-btn">
      <span class="chrome-search-icon">⌕</span>
      <span id="chrome-search-label">Open a plan</span>
      <kbd>⌘K</kbd>
    </button>
    <div id="chrome-actions">
      <div id="share-widget" class="hidden">
        <span id="share-url-text"></span>
        <button id="share-copy-btn" class="btn-ghost">Copy link</button>
      </div>
      <button id="panel-toggle-btn" class="chrome-icon-btn hidden" title="Inspector">◫</button>
    </div>
  </div>

  <div id="main-area">

    <div id="empty-state">
      <p>Select a plan to read it</p>
    </div>

    <div id="plan-header" class="hidden">
      <div id="plan-title-group">
        <h1 id="doc-title"></h1>
        <span id="doc-date"></span>
      </div>
      <div id="plan-actions">
        <span id="live-badge" class="hidden"><span class="live-dot"></span>Live</span>
        <div class="copy-wrap">
          <button id="copy-btn" class="btn-ghost">Copy</button>
          <div id="copy-menu" class="copy-menu hidden">
            <button id="copy-markdown-btn">Copy as Markdown</button>
            <button id="copy-text-btn">Copy as Plain Text</button>
            <button id="copy-with-comments-btn">Copy with Comments</button>
          </div>
        </div>
        <div id="view-switcher" class="hidden">
          <div class="switcher-indicator"></div>
          <button id="switcher-full" class="switcher-btn active">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1.5" y="1.5" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
              <line x1="3.5" y1="4.5" x2="9.5" y2="4.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
              <line x1="3.5" y1="6.5" x2="9.5" y2="6.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
              <line x1="3.5" y1="8.5" x2="7" y2="8.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
            Full plan
          </button>
          <button id="switcher-step" class="switcher-btn">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="3" cy="3" r="1.2" fill="currentColor"/>
              <circle cx="3" cy="6.5" r="1.2" fill="currentColor"/>
              <circle cx="3" cy="10" r="1.2" fill="currentColor"/>
              <line x1="5.5" y1="3" x2="10.5" y2="3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="5.5" y1="6.5" x2="10.5" y2="6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="5.5" y1="10" x2="8.5" y2="10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            Step through
          </button>
        </div>
        <button id="diff-btn" class="btn-ghost hidden">Diff</button>
        <button id="send-btn" class="btn-send hidden">Send to Claude</button>
      </div>
    </div>

    <div id="version-banner" class="hidden"></div>

    <div id="live-bar" class="hidden">
      <span class="live-bar-text">This plan is awaiting your approval — select text and press <kbd>⌘↵</kbd> to add a comment, then send to Claude.</span>
      <button id="live-dismiss-btn">Dismiss</button>
    </div>

    <div id="content-shell">
      <div id="content-main">
        <div id="viewer" class="hidden">
          <div id="viewer-body">
            <article id="doc-content" class="markdown-body"></article>
            <nav id="toc-panel" class="hidden">
              <div class="toc-label">On this page</div>
              <ul id="toc-list"></ul>
            </nav>
            <div id="diff-panel" class="hidden"></div>
          </div>
        </div>

        <div id="step-panel" class="hidden">
          <div id="step-nav"></div>
          <div id="step-body">
            <article id="step-content" class="markdown-body"></article>
          </div>
          <div id="step-footer">
            <button id="step-prev-btn" class="btn-ghost" disabled>← Previous</button>
            <span id="step-meta"></span>
            <button id="step-next-btn" class="btn-send">Next →</button>
          </div>
        </div>
      </div>

      <aside id="context-panel" class="hidden">
        <div id="context-tabs">
          <button id="context-code-tab" class="context-tab active">Code</button>
          <button id="context-changes-tab" class="context-tab">Changes</button>
          <button id="context-close-btn" title="Close inspector">×</button>
        </div>
        <div id="code-context" class="context-view">
          <div id="file-chip-row"></div>
          <div id="file-preview"></div>
        </div>
        <div id="changes-context" class="context-view hidden">
          <div id="changes-toolbar"></div>
          <div id="semantic-diff-list"></div>
        </div>
      </aside>
      </div>

  </div>
</div>

<!-- Floating add-comment button -->
<button id="comment-add-btn" class="hidden">+ Comment</button>

<!-- Comment input bubble -->
<div id="comment-bubble" class="hidden">
  <textarea id="comment-input" placeholder="Add a note for Claude..." rows="3" spellcheck="false"></textarea>
  <div class="comment-bubble-footer">
    <button id="comment-cancel-btn" class="btn-ghost">Cancel</button>
    <button id="comment-save-btn" class="btn-approve">Save</button>
  </div>
</div>

<!-- Comment hover tooltip -->
<div id="comment-tooltip" class="hidden">
  <div id="tooltip-note"></div>
  <button id="tooltip-delete">Delete</button>
</div>

<div id="toast"></div>

<!-- ⌘K command palette -->
<div id="palette" class="hidden">
  <div id="palette-backdrop"></div>
  <div id="palette-card">
    <input id="palette-input" placeholder="Search plans…" autocomplete="off" spellcheck="false" />
    <ul id="palette-list"></ul>
  </div>
</div>

<script src="marked.min.js"></script>
<script src="renderer.js"></script>
</body>
</html>
