<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src blob: 'self'" />
  <title>Design.md Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" data-theme="dark" data-pane-mode="split">
    <aside id="vault-rail">
      <div id="traffic-spacer"></div>
      <header class="vault-header">
        <div>
          <p class="eyebrow">Local vault</p>
          <h1>design.md</h1>
        </div>
        <button id="new-doc-btn" class="icon-btn" title="New design.md" aria-label="New design.md">+</button>
      </header>

      <section class="vault-actions">
        <button id="import-placeholder-btn" class="primary-wide">New file</button>
        <button id="rename-doc-btn">Rename</button>
        <button id="delete-doc-btn">Delete</button>
      </section>

      <section class="vault-section">
        <div class="section-label">Files</div>
        <div id="doc-list"></div>
      </section>

      <section class="vault-section recents">
        <div class="section-label">Recent</div>
        <div id="recent-list"></div>
      </section>
    </aside>

    <main id="workspace">
      <header id="topbar">
        <div class="doc-title-wrap">
          <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle vault">☰</button>
          <div>
            <p class="eyebrow">Design document</p>
            <h2 id="active-title">Untitled</h2>
          </div>
        </div>
        <div id="topbar-actions">
          <button id="command-btn" class="toolbar-btn">Search <kbd>⌘K</kbd></button>
          <button id="theme-btn" class="toolbar-btn">Light</button>
          <button id="save-btn" class="toolbar-btn">Save</button>
          <button id="copy-btn" class="toolbar-btn accent">Copy design.md</button>
        </div>
      </header>

      <div id="pane-toolbar">
        <div class="pane-title editor-title">
          <span>Markdown editor</span>
          <button id="editor-full-btn" class="icon-btn" aria-label="Editor fullscreen">↗</button>
        </div>
        <div class="pane-title preview-title">
          <span>Live preview</span>
          <div class="preview-tabs" role="tablist" aria-label="Preview tabs">
            <button class="preview-tab active" data-tab="document">Document</button>
            <button class="preview-tab" data-tab="tokens">Tokens</button>
            <button class="preview-tab" data-tab="components">Components</button>
          </div>
          <button id="preview-full-btn" class="icon-btn" aria-label="Preview fullscreen">↗</button>
        </div>
      </div>

      <div id="splitter">
        <section id="editor-pane" class="pane">
          <div id="editor-shell">
            <pre id="line-numbers" aria-hidden="true">1</pre>
            <textarea id="markdown-editor" spellcheck="false" autocomplete="off" aria-label="Markdown editor"></textarea>
          </div>
        </section>

        <section id="preview-pane" class="pane">
          <div id="preview-scroll">
            <article id="document-preview" class="preview-view markdown-body"></article>
            <article id="tokens-preview" class="preview-view hidden"></article>
            <article id="components-preview" class="preview-view hidden"></article>
          </div>
        </section>
      </div>

      <footer id="statusbar">
        <span id="save-state">Saved</span>
        <span id="stats">Characters: 0 · Words: 0 · Lines: 1</span>
        <label><input id="sync-scroll" type="checkbox" checked> Sync scroll</label>
      </footer>
    </main>
  </div>

  <div id="palette" class="hidden">
    <div id="palette-backdrop"></div>
    <div id="palette-card">
      <input id="palette-input" placeholder="Open file or run action…" autocomplete="off" spellcheck="false" />
      <ul id="palette-list"></ul>
      <div id="palette-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span><kbd>↵</kbd> Run</span>
        <span><kbd>Esc</kbd> Close</span>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="marked.min.js"></script>
  <script src="test-api.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
